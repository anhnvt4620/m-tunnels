services:
  m-tunnel-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    image: m-tunnel-gateway:latest
    container_name: m-tunnel-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"   # dashboard (chinh allowed_ips trong config)
      - "8443:8443"   # agent websocket
      - "12600-12799:12600-12799"  # public SQL ports
    volumes:
      - ../configs:/app/configs:ro
      - ../logs:/app/logs
      - gateway-data:/app/data
    command: ["-config", "/app/configs/gateway.yaml", "-log-file", "/app/logs/gateway.log"]

volumes:
  gateway-data:
